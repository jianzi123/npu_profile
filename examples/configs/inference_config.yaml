# 昇腾910C推理配置示例

# 模型配置
model:
  name: "resnet50"
  path: "./models/resnet50.pth"
  num_classes: 1000

# 推理配置
inference:
  # 批次大小
  batch_size: 32
  max_batch_size: 128

  # 精度配置
  precision: "fp16"  # fp32, fp16, int8, int4

  # TorchScript优化
  use_jit: true
  jit_mode: "trace"  # trace or script

  # 动态shape
  dynamic_shape: false
  dynamic_dims: [1, 4, 8, 16, 32]  # 支持的batch size列表

# 量化配置
quantization:
  enabled: false
  method: "ptq"  # qat or ptq
  weight_bits: 8
  activation_bits: 8
  symmetric_weight: true
  symmetric_activation: false
  calibration_samples: 1000
  calibration_batch_size: 32

# AMCT量化配置（昇腾专用）
amct:
  enabled: false
  config_file: "./amct_config.json"
  record_file: "./outputs/record.txt"
  save_path: "./outputs/quantized_model"

# ATC转换配置（转OM模型）
atc:
  enabled: false
  framework: 5  # 5=ONNX
  input_shape: "input:1,3,224,224"
  soc_version: "Ascend910C"
  precision_mode: "allow_fp32_to_fp16"
  op_select_implmode: "high_performance"
  fusion_switch_file: null
  output_path: "./outputs/model.om"

# 动态Batching配置
dynamic_batching:
  enabled: false
  max_queue_size: 1000
  timeout_ms: 10  # 等待超时时间
  preferred_batch_sizes: [8, 16, 32]

# 性能优化
performance:
  # Warmup
  warmup_iterations: 10

  # 流并发
  use_multiple_streams: false
  num_streams: 4

  # 内存预分配
  preallocate_buffers: true

  # 异步推理
  async_infer: false

  # NPU特定优化
  npu_options:
    jit_compile: true
    op_compiler_cache_mode: "enable"
    op_compiler_cache_dir: "./cache"

# 预处理配置
preprocessing:
  input_size: [224, 224]
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  normalize: true
  to_rgb: true

# 后处理配置
postprocessing:
  top_k: 5
  confidence_threshold: 0.5

# 服务配置
serving:
  # 服务类型
  backend: "fastapi"  # fastapi, triton, mindx

  # 网络配置
  host: "0.0.0.0"
  port: 8000
  workers: 4

  # 并发配置
  max_concurrent_requests: 100
  request_timeout: 30  # 秒

  # 日志配置
  log_level: "info"
  access_log: true

# Triton配置
triton:
  model_repository: "/models"
  instance_group:
    - count: 2
      kind: "KIND_GPU"
      gpus: [0, 1]
  max_batch_size: 32
  preferred_batch_sizes: [8, 16, 32]
  max_queue_delay_microseconds: 1000

# MindX SDK配置
mindx:
  device_id: 0
  model_path: "./models/model.om"
  aipp_config: null

# 性能监控
monitoring:
  enabled: true
  metrics:
    - "latency_p50"
    - "latency_p90"
    - "latency_p99"
    - "throughput"
    - "memory_usage"
  log_interval: 100

# Benchmark配置
benchmark:
  latency:
    enabled: true
    batch_sizes: [1, 8, 32]
    iterations: 1000
  throughput:
    enabled: true
    batch_size: 32
    duration: 60  # 秒
  find_optimal_batch:
    enabled: false
    max_batch_size: 256

# 硬件配置
hardware:
  device: "npu"
  device_id: 0
  soc_version: "Ascend910C"

# 调试配置
debug:
  enabled: false
  profile: false
  dump_inputs: false
  dump_outputs: false
  visualize: false
